name: pruebamotorsocial
description: "PrestaVecino: préstamo de objetos entre vecinos. Cliente de referencia de MotorSocial."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  # El motor: el cliente no copia código, sólo lo configura y compone.
  motorsocial:
    path: ../motorsocial

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/seed/
    - assets/seed/fotos/
